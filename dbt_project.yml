name: 'mmm_ready'
version: '0.2.0'
config-version: 2
require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  mmm_ready_raw_database: null        # default: target.database
  mmm_ready_raw_schema: null          # default: target.schema
  mmm_ready_ad_spend_identifier: ad_spend_daily
  mmm_ready_outcomes_identifier: outcomes_daily
  mmm_ready_controls_identifier: controls_daily
  mmm_ready_holiday_country: ES
  mmm_ready_min_history_weeks: 104    # reliable MMM: >= 2 years
  mmm_ready_max_zero_week_share: 0.5  # channel with >50% zero-spend weeks = low information
  mmm_ready_min_cv: 0.1               # minimum spend variation
  mmm_ready_max_spike_ratio: 5        # max week / mean
  mmm_ready_max_corr: 0.8             # collinearity between channels
  mmm_ready_max_unmapped_share: 0.02  # tolerated share of unmapped spend
  mmm_ready_drop_partial_weeks: true  # drop first/last week of mmm_input_weekly if < 7 days of outcomes

models:
  mmm_ready:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    diagnostics:
      +materialized: table

seeds:
  mmm_ready:
    channel_taxonomy:
      +column_types:
        platform: varchar
        campaign_type: varchar
        mmm_channel: varchar
        channel_group: varchar
        demand_capture: boolean
    holidays:
      +column_types:
        holiday_date: date
        country: varchar
        holiday_name: varchar
