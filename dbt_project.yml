name: 'mmm_ready'
version: '0.4.0'
config-version: 2
require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  mmm_ready_raw_database: null        # default: target.database
  mmm_ready_raw_schema: null          # default: target.schema
  mmm_ready_ad_spend_identifier: ad_spend_daily
  mmm_ready_outcomes_identifier: outcomes_daily
  mmm_ready_controls_identifier: controls_daily
  mmm_ready_holiday_country: ES
  # Readiness report thresholds (README, "Readiness thresholds"). Every default is a
  # heuristic, not a statistical standard: initial heuristic, adjustable.
  mmm_ready_min_history_weeks: 104    # blocking if expected_weeks < this. Initial heuristic, adjustable
  mmm_ready_max_unmapped_share: 0.02  # blocking if unmapped spend share > this. Initial heuristic, adjustable
  mmm_ready_max_kpi_missing_weeks: 0  # blocking if weeks without KPI > this. Initial heuristic, adjustable
  mmm_ready_max_platform_gap_weeks: 0 # review if any platform's gap weeks > this. Initial heuristic, adjustable
  mmm_ready_max_zero_week_share: 0.5  # review if share of zero-spend weeks > this. Initial heuristic, adjustable
  mmm_ready_min_cv: 0.1               # review if weekly spend CV < this. Initial heuristic, adjustable
  mmm_ready_max_spike_ratio: 5        # review if max week / mean week > this. Initial heuristic, adjustable
  mmm_ready_max_corr: 0.8             # review if |correlation| >= this (note: >=). Initial heuristic, adjustable
  mmm_ready_drop_partial_weeks: true  # drop first/last week of mmm_input_weekly if < 7 days of outcomes
  mmm_ready_pivot_all_channels: false # true: one column per taxonomy channel, even with zero spend
  mmm_ready_week_start: monday        # weekday weeks start on, identical on every warehouse
  # Optional GA4 / Firebase outcomes adapter (BigQuery only), see README
  mmm_ready_outcomes_source: raw      # raw | ga4 | firebase: where outcomes_daily comes from
  mmm_ready_ga4_project: null         # export project (default: target.database)
  mmm_ready_ga4_dataset: null         # export dataset, e.g. analytics_123456789
  mmm_ready_ga4_start_date: null      # YYYY-MM-DD, required with ga4/firebase: bounds _TABLE_SUFFIX
  mmm_ready_ga4_end_date: null        # YYYY-MM-DD, required with ga4/firebase
  mmm_ready_ga4_conversion_events: null  # list; null = [purchase] (ga4) / [in_app_purchase] (firebase)
  mmm_ready_ga4_revenue_field: null  # null = purchase_revenue (ga4) / event_value_in_usd (firebase); also purchase_revenue_in_usd
  mmm_ready_ga4_geo_field: region     # country | region | city
  mmm_ready_ga4_countries: []         # keep only these geo.country values; empty = all
  mmm_ready_ga4_dedupe_transactions: true  # count each transaction_id once
  mmm_ready_ga4_ai_referral: false    # build int_mmm__ga4_ai_referral_daily (GA4 web; reads event_params, ~7x the bytes)

models:
  mmm_ready:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    diagnostics:
      +materialized: table
    adapters:
      +materialized: table   # scan the export once per build

# Seed types are DDL type names, not macros: dbt.type_string() is not available here,
# so pick the string type by adapter (BigQuery has no varchar).
seeds:
  mmm_ready:
    channel_taxonomy:
      +column_types:
        platform: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        campaign_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        mmm_channel: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        channel_group: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        demand_capture: boolean
    ai_referral_domains:
      +column_types:
        domain: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        assistant: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
    holidays:
      +column_types:
        holiday_date: date
        country: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        holiday_name: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
