name: dbt CI (DuckDB)
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install dbt-duckdb pandas numpy
      - run: python ../scripts/generate_synthetic_data.py --out seeds
      - run: dbt deps
      - run: dbt seed
      - run: dbt build
