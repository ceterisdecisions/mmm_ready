name: dbt CI (DuckDB)
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install dbt-duckdb pandas numpy
      - run: python ../scripts/generate_synthetic_data.py --out seeds
      - run: dbt deps
      - run: dbt seed
      # The raw tables are sources, so dbt doesn't order them after their seeds: reloading
      # them inside build races with the staging models. They were loaded by dbt seed above.
      - run: dbt build --exclude "package:mmm_ready_integration_tests,resource_type:seed"
      - name: dbt build (non-default vars)
        run: "dbt build --exclude 'package:mmm_ready_integration_tests,resource_type:seed' --vars '{mmm_ready_drop_partial_weeks: false, mmm_ready_pivot_all_channels: true, mmm_ready_week_start: sunday}'"
      # The GA4/Firebase adapter is the one BigQuery-only part: it must refuse other targets.
      - name: GA4/Firebase adapter rejects non-BigQuery targets
        run: |
          for src in ga4 firebase; do
            if dbt compile --select stg_mmm__outcomes --vars "{mmm_ready_outcomes_source: $src}" > guard.log 2>&1; then
              echo "expected a compile error for mmm_ready_outcomes_source=$src on DuckDB"; exit 1
            fi
            grep -q "needs a BigQuery target" guard.log || { cat guard.log; exit 1; }
          done
      # MCP server tests run after dbt so the seeded-issues test sees the built DuckDB.
      # Separate venv: the MCP SDK pulls web dependencies we keep out of the dbt env.
      - name: MCP server tests
        working-directory: .
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/pip install -r mcp_server/requirements.txt
          .venv-mcp/bin/python -m pytest mcp_server/tests -v
