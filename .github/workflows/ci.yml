name: dbt CI (DuckDB)
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install dbt-duckdb pandas numpy
      - run: python ../scripts/generate_synthetic_data.py --out seeds
      - run: dbt deps
      - run: dbt seed
      - run: dbt build
      - name: dbt build (non-default cleanup vars)
        run: "dbt build --vars '{mmm_ready_drop_partial_weeks: false, mmm_ready_pivot_all_channels: true}'"
      # MCP server tests run after dbt so the seeded-issues test sees the built DuckDB.
      # Separate venv: the MCP SDK pulls web dependencies we keep out of the dbt env.
      - name: MCP server tests
        working-directory: .
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/pip install -r mcp_server/requirements.txt
          .venv-mcp/bin/python -m pytest mcp_server/tests -v
