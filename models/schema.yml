version: 2

models:
  - name: fct_marketing_spend_daily
    description: Daily spend aggregated by geo and MMM channel.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date_day, geo, mmm_channel]
    columns:
      - name: date_day
        tests: [not_null]
      - name: mmm_channel
        tests: [not_null]
      - name: demand_capture
        description: >
          True if the channel mainly captures existing demand (brand search, retargeting,
          retail media, affiliate) rather than creating it. Null for 'unmapped' spend.

  - name: fct_outcomes_daily
    description: Daily KPI by geo with control variables and holidays.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date_day, geo]

  - name: mmm_input_weekly
    description: >
      Wide week x geo table ready for MMM. One spend/impressions column per channel with
      spend (all taxonomy channels with mmm_ready_pivot_all_channels). Partial first/last
      weeks are dropped unless mmm_ready_drop_partial_weeks is false.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [week_start, geo]
    columns:
      - name: revenue
        tests: [not_null]

  - name: mmm_readiness_report
    description: >
      Per-channel diagnostic. readiness_status = ready | review | blocked.
      blocked: unmapped spend, short history or weeks without KPI.
      review: per-platform gaps, sparse channel, low variance, spikes or collinearity.

  - name: mmm_channel_correlations
    description: Weekly spend correlation between channel pairs.
