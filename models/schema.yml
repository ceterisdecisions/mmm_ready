version: 2

models:
  - name: fct_marketing_spend_daily
    description: Daily spend aggregated by geo and MMM channel.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date_day, geo, mmm_channel]
    columns:
      - name: date_day
        tests: [not_null]
      - name: mmm_channel
        tests: [not_null]
      - name: demand_capture
        description: >
          True if the channel mainly captures existing demand (brand search, retargeting,
          retail media, affiliate) rather than creating it. Null for 'unmapped' spend.

  - name: fct_outcomes_daily
    description: Daily KPI by geo with control variables and holidays.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date_day, geo]

  - name: mmm_input_weekly
    description: >
      Wide week x geo table ready for MMM. One spend/impressions column per channel with
      spend (all taxonomy channels with mmm_ready_pivot_all_channels). Partial first/last
      weeks are dropped unless mmm_ready_drop_partial_weeks is false.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [week_start, geo]
    columns:
      - name: revenue
        tests: [not_null]

  - name: mmm_readiness_report
    description: >
      Per-channel diagnostic. readiness_status = ready | review | blocked.
      blocked: unmapped spend, short history or weeks without KPI.
      review: per-platform gaps, sparse channel, low variance, spikes or collinearity.
      History, KPI coverage, spend shares and gaps use the full period; sparsity,
      variance and spikes skip partial edge weeks (see int_mmm__spend_week_calendar).
    columns:
      - name: complete_weeks
        description: expected_weeks minus the partial first/last week, if any. Denominator of zero_week_share.
      - name: kpi_source
        description: Where outcomes_daily came from (mmm_ready_outcomes_source) - raw, ga4 or firebase.
        tests:
          - accepted_values:
              arguments:
                values: ['raw', 'ga4', 'firebase']
      - name: warn_kpi_from_analytics
        description: >
          1 when the KPI comes from GA4/Firebase analytics instead of the ERP or backend.
          Informational only: not counted in blocking_issues, review_issues or readiness_status.

  - name: mmm_channel_correlations
    description: Weekly spend correlation between channel pairs, over complete weeks only.

  - name: int_mmm__spend_week_calendar
    description: >
      Weeks of spend data with their number of days. is_partial_edge_week = 1 for the
      first or last week when it has fewer than 7 days.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [week_start]
