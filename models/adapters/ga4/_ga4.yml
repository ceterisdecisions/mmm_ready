version: 2

models:
  - name: int_mmm__ga4_outcomes_daily
    description: >
      outcomes_daily built from the GA4 BigQuery export (web). Enabled with
      mmm_ready_outcomes_source: ga4; BigQuery only. Same columns as the raw
      outcomes_daily table, so everything downstream is unchanged.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date, geo]
    columns:
      - name: date
        description: event_date (property time zone).
        tests: [not_null]
      - name: geo
        description: geo.<mmm_ready_ga4_geo_field>, '(not set)' when missing.
        tests: [not_null]
      - name: revenue
        description: Sum of mmm_ready_ga4_revenue_field over conversion events (0 on days without any).
        tests: [not_null]
      - name: conversions
        description: Number of conversion events (deduplicated by transaction_id by default).
        tests: [not_null]

  - name: int_mmm__ga4_ai_referral_daily
    description: >
      GA4 web sessions, conversions and revenue per day, geo and traffic_source_group
      (ai_referral = referrer host or utm_source in the ai_referral_domains seed, else other).
      Enabled with mmm_ready_ga4_ai_referral: true; BigQuery and GA4 web only. Unpaid traffic:
      a separate table, not an MMM channel.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [date, geo, traffic_source_group, ai_assistant]
    columns:
      - name: traffic_source_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ai_referral', 'other']
      - name: ai_assistant
        description: Assistant of the matching domain (null for other).
      - name: sessions
        tests: [not_null]
      - name: conversions
        tests: [not_null]
