version: 2

sources:
  - name: mmm_ready_raw
    database: "{{ var('mmm_ready_raw_database') or target.database }}"
    schema: "{{ var('mmm_ready_raw_schema') or target.schema }}"
    tables:
      - name: ad_spend_daily
        identifier: "{{ var('mmm_ready_ad_spend_identifier') }}"
        description: Daily spend by geo, platform and campaign type.
      - name: outcomes_daily
        identifier: "{{ var('mmm_ready_outcomes_identifier') }}"
        description: Daily business KPI by geo (revenue, conversions).
      - name: controls_daily
        identifier: "{{ var('mmm_ready_controls_identifier') }}"
        description: Daily control variables by geo (price, promotions).
