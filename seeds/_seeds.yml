version: 2

seeds:
  - name: channel_taxonomy
    description: >
      Maps (platform, campaign_type) to an MMM channel. mmm_channel follows the
      family_qualifier convention documented in the README.
    tests:
      - mmm_ready.unique_combination:
          arguments:
            columns: [platform, campaign_type]
    columns:
      - name: mmm_channel
        tests: [not_null]
      - name: channel_group
        description: Channel family (search, social, video, display, retail_media, audio, ooh, affiliate, ai).
        tests: [not_null]
      - name: demand_capture
        description: True if the channel mainly captures existing demand rather than creating it.
        tests: [not_null]

  - name: ai_referral_domains
    description: >
      Referrer domains of AI assistants. A GA4 session whose referrer host (or utm_source)
      is one of these domains or a subdomain of one is classified as ai_referral by
      int_mmm__ga4_ai_referral_daily. Kept to the main assistants on purpose.
    columns:
      - name: domain
        description: Registrable domain or host, lowercase, without scheme or path.
        tests: [unique, not_null]
      - name: assistant
        description: Assistant the domain belongs to (several domains may share one).
        tests: [not_null]
